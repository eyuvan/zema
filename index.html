<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zema Bingo - መምረጫ ገጽ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- የካርቴላ መምረጫ ስክሪን -->
    <div id="selection-screen" class="screen active">
        
        <!-- 3ኛ. የላይኛው መረጃ ሰሌዳ (Top Info Bar) -->
        <div class="top-bar">
            <div>Play Stake: <span id="play-stake">10 Birr</span></div>
            <div>Main Wallet: <span id="main-wallet">0 Birr</span></div>
            <div>Play Wallet: <span id="play-wallet">10 Birr</span></div>
            <div class="timer-box">Timer: <span id="countdown">49</span>s</div>
        </div>

        <!-- መሪ ርዕስ እና የተመረጡት ብዛት መቆጣጠሪያ -->
        <h3 class="title">ካርቴላ ይምረጡ (እስከ 3 ካርቴላ)</h3>
        <div class="selected-count-text">የተመረጡ ካርቴላዎች: <span id="selected-count">0</span>/3</div>
        
        <!-- 1ኛ. ከ 1 - 600 ካርቴላዎች መረጫ Grid ሰሌዳ -->
        <div id="cartela-grid" class="grid-container"></div>
    </div>

    <!-- 2ኛ. የታችኛው Navigation Bar -->
    <nav class="navbar">
        <button class="nav-item active">Game</button>
        <button class="nav-item">Wallet</button>
        <button class="nav-item">History</button>
        <button class="nav-item">Profile</button>
    </nav>

    <script src="app.js"></script>
</body>
</html>
